version: '3.8'

services:
  altera-real-estate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: altera-real-estate
    restart: always
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
